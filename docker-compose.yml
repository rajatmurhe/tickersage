# docker compose up --build   ->  chat UI http://localhost:3000, API http://localhost:8000
# API keys are optional: without them the agent runs offline (rules router + template answers).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://tickersage:tickersage@db:5432/tickersage
      DOCS_BACKEND: pgvector
      PGVECTOR_URL: postgresql://tickersage:tickersage@db:5432/tickersage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle, so this is the API as the browser sees it.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tickersage
      POSTGRES_PASSWORD: tickersage
      POSTGRES_DB: tickersage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickersage"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
