# Strategy Studio eval set: python -m evals.run_strategy_evals
#
# compile   plain-language idea (+ answers to earlier questions) -> the expected spec fields
# clarify   an idea with key parts missing or unsupported -> exactly these clarifying questions, no spec
# broken    deliberately broken ideas -> the linter must raise these rules (gate: 100%). With `spec`,
#           the spec (as a model might have produced it) is linted against the idea instead of compiled.
# reject    injection or live-execution requests -> refused before anything is compiled (gate: 100%)
# backtest  compiled and backtested on the recorded klines; must complete with consistent numbers
#
# Percentages are in percent (5 = 5%). Entry/exit conditions list only the fields being checked.

# ------------------------------------------------------------------ compile

- id: sc-01
  category: compile
  idea: "Buy ETH on the 4h chart when RSI(14) drops below 30. Take profit at 6%, stop loss at 3%, and use 10% of the demo balance per trade."
  expect:
    symbol: ETH
    interval: 4h
    entry: [{kind: rsi, period: 14, op: crosses_below, value: 30}]
    take_profit_pct: 6
    stop_loss_pct: 3
    position_size_pct: 10

- id: sc-02
  category: compile
  idea: "Daily BTC: go long when the 50-day SMA crosses above the 200-day SMA, exit when it crosses back below, 8% stop, 20% of my balance."
  expect:
    symbol: BTC
    interval: 1d
    entry: [{kind: sma_cross, fast: 50, slow: 200, op: crosses_above}]
    exit_signals: [{kind: sma_cross, fast: 50, slow: 200, op: crosses_below}]
    stop_loss_pct: 8
    position_size_pct: 20

