# ------------------------------------------------------------------ fire (replayed data)
# Recorded values: ETH 1h RSI(14) 61.39, BTC 1h 69.07, SOL 1h 66.14, ETH 1d 40.62; 24h change on 1h candles:
# ETH +0.94%, BTC +1.48%, SOL +2.42%; tickers: BTC 81241.63, ETH 2370.1, SOL 102.12.

- id: af-01
  category: fire
  text: "ETH RSI(14) on 1h above 60"
  expect_met: true

- id: af-02
  category: fire
  text: "ETH RSI(14) on 1h below 30"
  expect_met: false

- id: af-03
  category: fire
  text: "BTC rises 1% in 24 hours"
  expect_met: true

- id: af-04
  category: fire
  text: "BTC moves more than 2% in 24 hours"
  expect_met: false

- id: af-05
  category: fire
  text: "Alert me when SOL is above $100"
  expect_met: true

- id: af-06
  category: fire
  text: "Alert me when ETH is below $2,000"
  expect_met: false

- id: af-07
  category: fire
  text: "SOL RSI on 1h above 65 and SOL rises 2% in 24h"
  expect_met: true

- id: af-08
  category: fire
  text: "SOL RSI on 1h above 65 and SOL rises 3% in 24h"
  expect_met: false

- id: af-09
  category: fire
  text: "BTC 1h RSI above 80 or BTC rises 1% in 24 hours"
  expect_met: true

- id: af-10
  category: fire
  text: "Tell me when ETH on the daily chart is below the 20 SMA"
  expect_met: true

# ------------------------------------------------------------------ cooldown (scheduler decisions)

- id: acd-01
  category: cooldown
  cooldown_minutes: 60
  checks: [[0, true], [5, true], [10, false], [15, true], [70, true], [75, false], [80, true]]
  expect: [fire, wait_rearm, rearm, cooldown, fire, rearm, cooldown]

- id: acd-02
  category: cooldown
  cooldown_minutes: 30
  checks: [[0, false], [5, false], [10, true], [20, true]]
  expect: [idle, idle, fire, wait_rearm]

- id: acd-03
  category: cooldown
  cooldown_minutes: 1440
  checks: [[0, true], [60, false], [120, true], [1439, true], [1440, true], [1500, true]]
  expect: [fire, rearm, cooldown, cooldown, fire, wait_rearm]

- id: acd-04
  category: cooldown
  cooldown_minutes: 60
  checks: [[0, null], [5, true], [10, null], [15, false], [20, null], [80, true]]
  expect: [error, fire, error, rearm, error, fire]
