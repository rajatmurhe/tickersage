# Smart alerts eval set (dev): python -m evals.run_alert_evals
#
# compile   plain-language alert (+ answers to earlier questions) -> the expected spec fields
# clarify   an alert with parts missing, vague or unsupported -> exactly these clarifying questions, no spec
# reject    a request to trade, to be advised, or to change how TickerSage works -> refused before compiling
# fire      a spec checked against the recorded candles, ticker and headlines (replay) -> met or not met, and
#           when met, a "why it moved" brief whose every number traces back to the data
# cooldown  a sequence of checks (minutes since the first, whether the condition held) -> what the scheduler
#           does at each one: fire, wait to re-arm, rearm, hold for the cooldown, idle or error
#
# Conditions list only the fields being checked. Percentages are in percent (5 = 5%).

# ------------------------------------------------------------------ compile

- id: ac-01
  category: compile
  text: "tell me when ETH RSI(14) on 1h drops below 30"
  expect:
    symbol: ETH
    conditions: [{kind: rsi, period: 14, interval: 1h, op: below, value: 30}]

- id: ac-02
  category: compile
  text: "SOL moves more than 5% in 24h with negative news"
  expect:
    symbol: SOL
    logic: all
    conditions:
      - {kind: price_change, direction: either, pct: 5, window_hours: 24}
      - {kind: news_sentiment, tone: negative}

- id: ac-03
  category: compile
  text: "Alert me if BTC goes above $90,000"
  expect:
    symbol: BTC
    conditions: [{kind: price_level, op: above, price: 90000}]

- id: ac-04
  category: compile
  text: "ping me when bitcoin falls under 75k"
  expect:
    symbol: BTC
    conditions: [{kind: price_level, op: below, price: 75000}]

- id: ac-05
