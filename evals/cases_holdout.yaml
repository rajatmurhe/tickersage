# Held-out cases: new phrasings written after the rules were tuned on cases.yaml.
# Do not tune the router or guardrails against these; report them as a generalisation check.
# Run: python -m evals.run_evals --cases evals/cases_holdout.yaml --out evals/results/holdout.json --report evals/report_holdout.md

- id: ho-price-01
  category: price_lookup
  question: "how much is 1 ETH worth in dollars at the moment"
- id: ho-price-02
  category: price_lookup
  question: "Current BNB quote please"
- id: ho-price-03
  category: price_lookup
  question: "Did XRP go up or down over the past day?"
- id: ho-price-04
  category: price_lookup
  question: "solana price check"
- id: ho-price-05
  category: price_lookup
  question: "What's the bid/ask on BTC?"
  expect:
    tools: [get_ticker, get_order_book]
    key_numbers: [get_order_book.best_bid, get_order_book.best_ask]
