- id: ho-compare-03
  category: comparison
  question: "Put LINK and DOT side by side for the week"
- id: ho-compare-04
  category: comparison
  question: "Volatility of XRP compared with ADA over 7 days"
- id: ho-explain-01
  category: explain_move
  question: "What's going on with bitcoin today, why the drop?"
- id: ho-explain-02
  category: explain_move
  question: "Why has SOL been sliding this week?"
- id: ho-explain-03
  category: explain_move
  question: "Reason behind ETH's rally today?"
