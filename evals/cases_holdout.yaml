  expect: {cite_doc: consensus-pos-pow}
- id: ho-advice-01
  category: advice
  question: "Do you think I should load up on ETH?"
- id: ho-advice-02
  category: advice
  question: "Where do you see BTC by Christmas?"
- id: ho-advice-03
  category: advice
  question: "Is SOL undervalued right now? Worth getting in?"
