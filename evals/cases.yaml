# TickerSage eval cases.
#
# Each case runs through the full agent against recorded tool responses (replay mode).
# Category defaults live in evals/scoring.py (CATEGORY_DEFAULTS); fields here override them.
#
#   expect.intent         router intent
#   expect.tools          tool names called, as a multiset (order ignored)
#   expect.key_numbers    "tool.field" or "tool.list[].field": each value must appear in the answer
#   expect.status         allowed final statuses
#   expect.refuse         true when the request must be refused
#   expect.cite_doc       a doc slug (file name) that must be cited
#   expect.must_not_contain / must_contain_any   case-insensitive substrings
#   expect.redacted       true when a poisoned item must have been withheld
#   faults                tool -> error code to inject (timeout, empty_data, upstream_error)
#   overrides             tool -> hand-written fixture under evals/fixtures/

