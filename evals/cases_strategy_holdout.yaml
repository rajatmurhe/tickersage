# Held-out Strategy Studio eval set: written blind, without seeing the parser, linter, its tests, or cases_strategy.yaml.

# ---------------------------------------------------------------- compile (15)

- id: hc-01
  category: compile
  idea: "buy ETH on the 4h when RSI drops below 30. tp 6% sl 3%, $1000 per trade"
  expect:
    symbol: ETH
    interval: 4h
    entry: [{kind: rsi, op: crosses_below, value: 30}]
    take_profit_pct: 6
    stop_loss_pct: 3
    position_size_pct: 10

- id: hc-02
  category: compile
  idea: "BTC daily golden cross entry. take profit 15 percent, stop loss 7 percent, position size 20%"
  expect:
    symbol: BTC
    interval: 1d
    entry: [{kind: sma_cross, fast: 50, slow: 200, op: crosses_above}]
    take_profit_pct: 15
    stop_loss_pct: 7
    position_size_pct: 20

- id: hc-03
  category: compile
  idea: "sol 1h: buy when rsi(14) is under 25, sell when rsi goes above 60. stop loss 2%, use 5% of my balance"
  expect:
    symbol: SOL
    interval: 1h
    entry: [{kind: rsi, period: 14, op: below, value: 25}]
    exit_signals: [{kind: rsi, op: crosses_above, value: 60}]
    stop_loss_pct: 2
    position_size_pct: 5

- id: hc-04
  category: compile
  idea: "Buy DOGE when price drops 8% in 24 hours on 1h candles, take profit 5%, stop loss 4%, $500 per trade"
  expect:
    symbol: DOGE
    interval: 1h
    entry: [{kind: price_change, direction: down, pct: 8, lookback_hours: 24}]
    take_profit_pct: 5
    stop_loss_pct: 4
    position_size_pct: 5

- id: hc-05
  category: compile
  idea: "LINK 4H - go long when price crosses above the 50 SMA. TP 10%, SL 5%, max hold 5 days, size 10%"
  expect:
    symbol: LINK
    interval: 4h
    entry: [{kind: price_vs_sma, period: 50, op: crosses_above}]
    take_profit_pct: 10
    stop_loss_pct: 5
    max_hold_hours: 120
    position_size_pct: 10

- id: hc-06
  category: compile
  idea: "avax, 15m chart. buy if RSI < 20. stoploss 1.5%, take profit 3%, exit after 12 hours, position size $1500"
  expect:
    symbol: AVAX
    interval: 15m
    entry: [{kind: rsi, op: below, value: 20}]
    stop_loss_pct: 1.5
    take_profit_pct: 3
    max_hold_hours: 12
    position_size_pct: 15

- id: hc-07
  category: compile
  idea: "ETH daily: enter when the 20 sma crosses above the 50 sma, sell when the 20 sma crosses below the 50 sma. stop loss 8%, 15% of balance per trade, fees 0.1%, slippage 0.05%"
  expect:
    symbol: ETH
    interval: 1d
    entry: [{kind: sma_cross, fast: 20, slow: 50, op: crosses_above}]
    exit_signals: [{kind: sma_cross, fast: 20, slow: 50, op: crosses_below}]
    stop_loss_pct: 8
    position_size_pct: 15
    fee_pct: 0.1
    slippage_pct: 0.05

- id: hc-08
  category: compile
  idea: "bitcoin 4h candles. buy when rsi is oversold, take profit 8%, stop loss 4%, position size 10%"
