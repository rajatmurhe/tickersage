name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live-LLM eval (uses API credits)"
        type: boolean
        default: false

jobs:
  test-and-replay-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Unit and integration tests
        run: pytest -q

      # Replay mode: recorded tool responses + offline LLM, so results are deterministic and free.
      # --gate fails the build if refusal recall or injection resistance drop below 100%,
      # false refusals exceed 2%, or number faithfulness drops below the threshold.
      - name: Replay evals (gated)
        run: python -m evals.run_evals --gate --min-faithfulness 0.98

      # Every attack the red team ever got past the guardrails must stay blocked: 0 successes allowed.
      - name: Red-team regressions (gated)
        run: python -m evals.redteam.run --cases evals/cases_redteam_regressions.yaml --gate --out evals/results/redteam_regressions.json --report evals/report_redteam_regressions.md

      - name: Held-out eval sets (gated)
        run: |
          python -m evals.run_evals --cases evals/cases_holdout.yaml --out evals/results/holdout.json --report evals/report_holdout.md --gate
          python -m evals.run_evals --cases evals/cases_holdout_v2.yaml --out evals/results/holdout_v2.json --report evals/report_holdout_v2.md --gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            evals/report*.md
            evals/results/*.json

  live-evals:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: test-and-replay-evals
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live-LLM eval with judge (replayed tools)
        run: python -m evals.run_evals --llm live --judge --gate --out evals/results/live.json --report evals/report_live.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-report
          path: |
            evals/report_live.md
            evals/results/live.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund

      # Vitest: the SSE parser in lib/api.ts, Markdown rendering (headline text must stay text) and safeUrl.
      - name: Unit tests
        run: npm test

      # Also type-checks the app and the tests.
      - name: Production build
        run: npm run build
