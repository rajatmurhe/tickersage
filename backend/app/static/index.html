<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TickerSage</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><h1>TickerSage</h1><span>crypto market research · read-only</span></div>
    <nav><span id="mode" class="pill">…</span><a href="/evals">Evals</a><a href="/docs">API</a></nav>
  </header>
  <main>
    <p class="intro">Ask about prices, moves, volatility, order books, news sentiment or crypto concepts. Every number
      is computed in Python from public exchange data and checked against the tool output before you see it. No
      trading, no advice.</p>
    <div class="examples" id="examples"></div>
    <div id="log"></div>
  </main>
  <form class="ask" id="ask">
    <div class="inner">
      <input id="q" autocomplete="off" maxlength="1000" placeholder="e.g. Compare ETH and SOL over the last 7 days" required>
      <button id="send" type="submit">Ask</button>
    </div>
  </form>
  <script src="/static/app.js"></script>
</body>
</html>
