# Sources for the docs corpus. `python -m app.rag.ingest` (run from backend/) fetches each one, converts it to
# Markdown and writes backend/docs_corpus/sources/<id>.md with this metadata in its front matter, so the app,
# the tests and CI never touch the network. Every source is permissively licensed or public documentation.
#
# format: pdf | markdown (GitHub-flavoured, ethereum.org MDX) | mediawiki (BIPs) | wikipedia (plain-text extract)
# The 24 hand-written glossary files in backend/docs_corpus/*.md are original TickerSage text and are listed last.

licenses:
  MIT-bitcoin.org: "MIT (bitcoin.org states the whitepaper is MIT-licensed)"
  MIT-ethereum.org: "MIT (ethereum/ethereum-org-website LICENSE)"
  CC0-1.0: "CC0 1.0 (all EIPs and ERCs are CC0)"
  CC-BY-SA-4.0: "CC BY-SA 4.0 (Wikipedia text; attribution: Wikipedia contributors)"
  binance-public-docs: "No license file; public API documentation from github.com/binance/binance-spot-api-docs, used for reference with attribution (Binance terms: https://www.binance.com/en/terms)"
  bip-header: "Per-document licence from the BIP header (recorded on fetch)"
  tickersage: "Original TickerSage text (glossary)"

sources:
